[build-system]
requires = ["setuptools>=60", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tlrl"
version = "1.0.0"
description = "Too long. Read later."
requires-python = ">=3.10"
dependencies = [
  "beautifulsoup4",
  "chardet",
  "click",
  "css_inline",
  "cssselect",
  "fake-useragent",
  "flask",
  "gunicorn",
  "Jinja2",
  "lxml",
  "lxml-html-clean>=0.4.2",
  "markdown",
  "openai",
  "pandas",
  "prefect>=1.0,<2.0",
  "readability",
  "requests",
  "tiktoken>=0.8.0",
]
[project.optional-dependencies]
dev = ["pytest", "black", "ruff", "isort"]

[tool.uv.sources]
readability = { path = "python-readability" }
